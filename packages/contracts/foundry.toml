[profile.default]
src = "contracts"
out = "exports/abi"
libs = ["node_modules"]
test = "test"
script = "scripts"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
]

[profile.ci]
fuzz = { runs = 1000 }
invariant = { runs = 256 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "thousands"
wrap_comments = true

[rpc_endpoints]
localhost  = "http://127.0.0.1:8545"
