name: Changeset Release — @vnkrvietnam/* packages

# Triggers:
#   1. On every push to `main` — opens/updates the "Version Packages" PR
#      (changeset-action creates a PR that bumps versions + updates CHANGELOGs)
#   2. When that PR is merged — publishes only the packages with pending changesets

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version or Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create commits / tags
      pull-requests: write   # open the "Version Packages" PR
      packages: write        # push to GitHub Packages
      id-token: write        # NPM provenance attestation

    steps:
      # ── 1. Checkout full history (required by changeset-action) ──────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Setup pnpm ────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # ── 3. Setup Node (auth against GitHub Packages) ─────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@vnkrvietnam'

      # ── 4. Install all workspace deps ────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 5. Build — respects Turborepo dependency order ───────────────────
      #        types → config → core-sdk / swift-adapter / merchant-sdk → ui-kit
      - name: Build packages (turbo)
        run: pnpm turbo run build --filter="./packages/*"

      # ── 6. Run tests ─────────────────────────────────────────────────────
      - name: Test packages (turbo)
        run: pnpm turbo run test --filter="./packages/*"

      # ── 7. Changeset action:
      #       • If pending .changeset/*.md files exist → opens/updates the
      #         "Version Packages" PR (bumps versions, writes CHANGELOGs)
      #       • If no .changeset files (i.e. the Version PR was just merged)
      #         → publishes changed packages to GitHub Packages registry
      - name: Create Version PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
          commit: 'chore: version packages'
          title: 'chore: version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 8. Summary ───────────────────────────────────────────────────────
      - name: Publish summary
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "### 📦 Published packages" >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.changesets.outputs.publishedPackages }}' \
            | jq -r '.[] | "- **\(.name)** `\(.version)`"' >> $GITHUB_STEP_SUMMARY
