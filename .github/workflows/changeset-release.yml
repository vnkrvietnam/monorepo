name: Release & Publish Packages

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Changesets Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # Đặt registry-url để action tự inject NODE_AUTH_TOKEN vào ~/.npmrc
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Build theo thứ tự dependency ────────────────────────────────────────
      - name: Build all packages
        run: pnpm --filter "@vnkrvietnam/*" build

      # ── Changesets: tạo PR hoặc publish ────────────────────────────────────
      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN → inject vào ~/.npmrc bởi setup-node action
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── Publish restricted packages → GitHub Packages (nếu có release) ─────
      - name: Publish to GitHub Packages
        if: steps.changesets.outputs.published == 'true'
        run: |
          pnpm publish -r \
            --filter "@vnkrvietnam/sdk-swift" \
            --filter "@vnkrvietnam/sdk-internal" \
            --filter "@vnkrvietnam/swift-adapter" \
            --filter "@vnkrvietnam/swift-sdk-internal" \
            --registry https://npm.pkg.github.com \
            --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
