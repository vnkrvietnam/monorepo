name: Publish @vnkr Packages to GitHub Packages

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'pnpm-lock.yaml'
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@vnkrvietnam'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages via Turborepo
        run: pnpm turbo run build --filter="./packages/*"

      - name: Verify package versions (no drift)
        run: pnpm --filter @vnkr/deploy-npm registry:check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Publish @vnkr/* packages to GitHub Packages
        run: pnpm --filter "./packages/*" publish --no-git-checks --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
