# ═══════════════════════════════════════════════════════════════════════════════
#  VNKR — Nginx Reverse Proxy Config
#  Domain  : swap.vnkr.vn
#  Upstream: localhost:3004 (Next.js 14 — production)
#  TLS     : Let's Encrypt via certbot (managed in-place)
#  Version : 1.0.0
# ═══════════════════════════════════════════════════════════════════════════════

# ── Upstream pool ──────────────────────────────────────────────────────────────
upstream swap_dex {
    server 127.0.0.1:3004;
    keepalive 64;
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name swap.vnkr.vn;

    # ACME challenge (Let's Encrypt HTTP-01)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Tất cả traffic còn lại redirect 301 → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ───────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name swap.vnkr.vn;

    # ── TLS certificates (certbot sẽ tự inject/update dòng này) ─────────────
    ssl_certificate     /etc/letsencrypt/live/swap.vnkr.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swap.vnkr.vn/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── TLS hardening ─────────────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout          5s;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            SAMEORIGIN always;
    add_header X-Content-Type-Options     nosniff    always;
    add_header X-XSS-Protection           "1; mode=block" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml font/truetype font/opentype
        image/svg+xml;

    # ── Next.js static assets (_next/static) — cache 1 năm immutable ─────────
    location /_next/static/ {
        proxy_pass         http://swap_dex;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Next.js image optimization (_next/image) ─────────────────────────────
    location /_next/image {
        proxy_pass         http://swap_dex;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=86400";
    }

    # ── Favicon & public static files ────────────────────────────────────────
    location ~* \.(ico|png|jpg|jpeg|webp|svg|woff2|woff|ttf|eot)$ {
        proxy_pass         http://swap_dex;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # ── Main reverse proxy → Next.js ─────────────────────────────────────────
    location / {
        proxy_pass         http://swap_dex;
        proxy_http_version 1.1;

        # WebSocket support (Next.js HMR / WS endpoints)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Timeouts
        proxy_connect_timeout  60s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;

        # Buffer
        proxy_buffering            on;
        proxy_buffer_size          16k;
        proxy_buffers              8 16k;
        proxy_busy_buffers_size    32k;

        # Không cache HTML — để Next.js ISR / SSR hoạt động đúng
        proxy_cache_bypass         1;
        proxy_no_cache             1;
    }

    # ── Health check endpoint ─────────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ── Logs ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/swap.vnkr.vn.access.log;
    error_log  /var/log/nginx/swap.vnkr.vn.error.log warn;
}
