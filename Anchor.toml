[toolchain]
anchor_version = "0.30.1"
solana_version = "1.18.22"

[features]
resolution = true
skip-lint = false

[programs.devnet]
vnkr_p2p_escrow     = "ESCRw1111111111111111111111111111111111111111"
vnkr_mint_governance = "MINTg1111111111111111111111111111111111111111"
vnkr_amm_swap        = "AMMSw1111111111111111111111111111111111111111"
vnkr_treasury_rbs    = "TRBSr1111111111111111111111111111111111111111"

[programs.mainnet]
vnkr_p2p_escrow     = "ESCRm1111111111111111111111111111111111111111"
vnkr_mint_governance = "MINTm1111111111111111111111111111111111111111"
vnkr_amm_swap        = "AMMSm1111111111111111111111111111111111111111"
vnkr_treasury_rbs    = "TRBSm1111111111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet   = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[workspace]
members = [
  "programs/VNKR-p2p-escrow",
  "programs/VNKR-mint-governance",
  "programs/VNKR-amm-swap",
  "programs/VNKR-treasury-rbs",
]
